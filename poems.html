<!DOCTYPE html>
<!-- 作者：董文博 | 建立时间：2026-11-13 | 使用大模型：DeepSeek-V4.1-Flash | 功能：本地 Express 服务器提供 db.json 数据，页面 fetch 渲染上图下文诗词卡片，支持关键字搜索与按标题长度排序 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>诗词卡片 · JSON → 服务器 → fetch 全链路</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:#f5f7fb;color:#1f2937}
  .wy_wrap{max-width:1000px;margin:0 auto;padding:36px 20px 60px}
  .wy_head{background:linear-gradient(135deg,#14532d,#16a34a);color:#fff;border-radius:18px;padding:28px 32px;box-shadow:0 10px 26px rgba(22,163,74,.25);margin-bottom:22px}
  .wy_head h1{font-size:24px;letter-spacing:1px}
  .wy_head p{margin-top:10px;font-size:14px;color:#dcfce7;line-height:1.9}
  .wy_head code{background:rgba(255,255,255,.16);padding:1px 7px;border-radius:5px;font-family:Consolas,monospace;font-size:13px}
  .wy_tip{background:#fffbea;border:1px solid #fde68a;color:#7c5e10;border-radius:12px;padding:12px 18px;font-size:13.5px;line-height:1.9;margin-bottom:20px}
  .wy_tip b{color:#b45309}

  /* 搜索 / 排序工具条 */
  .wy_toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px 16px;box-shadow:0 4px 14px rgba(31,41,55,.06)}
  .wy_toolbar input{flex:1;min-width:200px;border:1.5px solid #d1d5db;border-radius:999px;padding:9px 16px;font-size:14px;font-family:inherit;outline:none;transition:border-color .2s}
  .wy_toolbar input:focus{border-color:#16a34a}
  .wy_toolbar button{border:1.5px solid #16a34a;background:#fff;color:#15803d;font-size:13.5px;font-family:inherit;padding:9px 18px;border-radius:999px;cursor:pointer;transition:all .2s}
  .wy_toolbar button:hover{background:#16a34a;color:#fff}
  .wy_count{font-size:13px;color:#6b7280;margin-left:auto}

  /* 上图下文卡片列表 */
  .wy_poem_list{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
  .wy_poem_card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #e5e7eb;box-shadow:0 4px 14px rgba(31,41,55,.07);transition:transform .2s,box-shadow .2s}
  .wy_poem_card:hover{transform:translateY(-4px);box-shadow:0 12px 26px rgba(31,41,55,.14)}
  .wy_poem_card img{width:100%;height:170px;object-fit:cover;display:block;background:#e5e7eb}
  .wy_poem_body{padding:14px 16px 18px}
  .wy_poem_body h2{font-size:16px;color:#14532d;margin-bottom:6px}
  .wy_poem_author{display:inline-block;font-size:12px;color:#15803d;background:#dcfce7;border-radius:999px;padding:2px 10px;margin-bottom:8px}
  .wy_poem_body p{font-size:13.5px;color:#4b5563;line-height:1.9}

  /* 加载 / 失败 / 空结果提示 */
  .wy_state{text-align:center;padding:40px 16px;font-size:14.5px;color:#6b7280;line-height:2}
  .wy_state.wy_error{color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:12px}

  .wy_back{text-align:center;margin-top:32px}
  .wy_back a{display:inline-block;text-decoration:none;color:#14532d;font-size:14px;font-weight:bold;background:#fff;border:1px solid #d1fae5;border-radius:999px;padding:10px 26px;transition:transform .2s,box-shadow .2s}
  .wy_back a:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(20,83,45,.15)}
</style>
</head>
<body>
<div class="wy_wrap">
  <div class="wy_head">
    <h1>诗词卡片 · 数据来自本地服务器</h1>
    <p>数据链路：<code>db/db.json</code> → <code>node server.js</code>（端口 3004）→ <code>fetch('/api/poems')</code> + <code>fetch('/api/authors')</code> → JSON 解析 → 渲染卡片</p>
  </div>

  <div class="wy_tip">
    <b>📌 使用前提：</b>先在 <b>db 文件夹</b>里执行 <code>node server.js</code>，看到“数据服务器已启动：http://localhost:3004/api/poems”后再刷新本页；服务器关掉时，本页会显示失败提示而不是白屏。
  </div>

  <div class="wy_toolbar">
    <input type="text" id="wy_search" placeholder="输入关键字，只显示标题或内容匹配的诗词">
    <button id="wy_sortBtn">按标题长度排序</button>
    <span class="wy_count" id="wy_count"></span>
  </div>

  <ul class="wy_poem_list" id="wy_poemList"></ul>
  <div class="wy_state" id="wy_state">正在从服务器获取数据…</div>

  <div class="wy_back"><a href="index.html">← 返回首页</a></div>
</div>

<script>
  var wy_apiPoems = 'http://localhost:3004/api/poems';
  var wy_apiAuthors = 'http://localhost:3004/api/authors';

  var wy_allPoems = [];        // 服务器返回的完整诗词数组（搜索时在此基础上过滤）
  var wy_authorInfo = {};      // 作者名 → 朝代，由 /api/authors 构建
  var wy_sortByLength = false; // 是否处于“按标题长度排序”状态

  // 函数：渲染诗词卡片列表（上图下文），传入什么数组就画什么
  function wy_renderPoems(wy_list) {
    var wy_html = '';
    for (var wy_i = 0; wy_i < wy_list.length; wy_i++) {
      var wy_p = wy_list[wy_i];
      var wy_dynasty = wy_authorInfo[wy_p.author] || '';
      wy_html += '<li class="wy_poem_card">'
        + '<img src="' + wy_p.pic + '" alt="' + wy_p.title + '">'
        + '<div class="wy_poem_body">'
        + '<h2>' + wy_p.title + '</h2>'
        + '<span class="wy_poem_author">' + wy_p.author + (wy_dynasty ? ' · ' + wy_dynasty : '') + '</span>'
        + '<p>' + wy_p.content + '</p>'
        + '</div></li>';
    }
    document.getElementById('wy_poemList').innerHTML = wy_html;
    document.getElementById('wy_count').textContent = '共 ' + wy_list.length + ' 条';
    document.getElementById('wy_state').style.display = wy_list.length === 0 ? 'block' : 'none';
    if (wy_list.length === 0) {
      document.getElementById('wy_state').className = 'wy_state';
      document.getElementById('wy_state').textContent = '没有匹配的诗词，换个关键字试试。';
    }
  }

  // 函数：根据搜索关键字与排序开关，对全量数据加工后重新渲染
  function wy_applyFilter() {
    var wy_keyword = document.getElementById('wy_search').value.trim();
    var wy_result = wy_allPoems.filter(function (wy_p) {
      return wy_p.title.indexOf(wy_keyword) !== -1 || wy_p.content.indexOf(wy_keyword) !== -1;
    });
    if (wy_sortByLength) {
      wy_result = wy_result.slice().sort(function (wy_a, wy_b) {
        return wy_a.title.length - wy_b.title.length;
      });
    }
    wy_renderPoems(wy_result);
  }

  // 函数：用 Promise.all 同时请求两个接口，取回诗词与作者数据后首次渲染
  function wy_loadAll() {
    var wy_state = document.getElementById('wy_state');
    Promise.all([fetch(wy_apiPoems), fetch(wy_apiAuthors)])
      .then(function (wy_resList) {
        if (!wy_resList[0].ok || !wy_resList[1].ok) {
          throw new Error('HTTP ' + wy_resList[0].status + ' / ' + wy_resList[1].status);
        }
        return Promise.all([wy_resList[0].json(), wy_resList[1].json()]);
      })
      .then(function (wy_data) {
        wy_allPoems = wy_data[0];
        wy_data[1].forEach(function (wy_author) {
          wy_authorInfo[wy_author.name] = wy_author.dynasty;
        });
        wy_state.style.display = 'none';
        wy_applyFilter();
      })
      .catch(function () {
        wy_state.className = 'wy_state wy_error';
        wy_state.innerHTML = '数据获取失败！请先在 db 文件夹运行 <b>node server.js</b>（端口 3004），再刷新本页。';
      });
  }

  // 函数：async / await 写法（与上面的 Promise.all 等价，答辩时可对比讲解）
  async function wy_loadAllAsync() {
    try {
      const [wy_respPoems, wy_respAuthors] = await Promise.all([fetch(wy_apiPoems), fetch(wy_apiAuthors)]);
      const [wy_poems, wy_authors] = await Promise.all([wy_respPoems.json(), wy_respAuthors.json()]);
      wy_allPoems = wy_poems;
      wy_authors.forEach(function (wy_author) {
        wy_authorInfo[wy_author.name] = wy_author.dynasty;
      });
      document.getElementById('wy_state').style.display = 'none';
      wy_applyFilter();
    } catch (wy_err) {
      console.log('请求失败：', wy_err);
      const wy_state = document.getElementById('wy_state');
      wy_state.className = 'wy_state wy_error';
      wy_state.innerHTML = '数据获取失败！请先在 db 文件夹运行 <b>node server.js</b>（端口 3004）。';
    }
  }

  // 函数：绑定搜索框输入与排序按钮的监听事件
  function wy_bindEvents() {
    document.getElementById('wy_search').addEventListener('input', function () {
      wy_applyFilter();
    });
    document.getElementById('wy_sortBtn').addEventListener('click', function () {
      wy_sortByLength = !wy_sortByLength;
      this.textContent = wy_sortByLength ? '恢复默认顺序' : '按标题长度排序';
      wy_applyFilter();
    });
  }

  wy_bindEvents();
  wy_loadAll();   // 页面加载完立即请求（默认用 Promise.all 版本）
</script>
</body>
</html>

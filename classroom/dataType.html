<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据类型和运算符</title>
    <style>
        div {
            width: 180px;
            height: 180px;
            background-color: violet;
            margin: 10px;
            color: #000;
            text-align: center;
            line-height: 180px;
            font-size: 100px;
            float: left;
        }
    </style>
</head>

<body>

    <script>
        var a = 6;
        var b = 1;
        console.log(a + b);
        console.log(a++, ++b);
        console.log(a - b > 0 ? a : b);
        console.log(true && false, true || false, !true);
        var str = 'hallo word', num = 123, bl = true, obj = { name: '张三', age: 18 }, ud, kong = null;
        console.log(typeof str, typeof num, typeof bl, typeof obj, typeof ud, typeof kong);
        console.log(0.1 + 0.2 == 0.3);
        console.log(1 + '1', '1' - 1, '11' + 1 - 1);
        console.log('dongwenbo' - 1);
        console.log(isNaN(NaN));
        console.log(NaN == NaN, null == null);
        console.log(parseInt('123.79'));
        var num = 123.79;
        console.log(num == parseInt(num));
        console.log(parseInt('100', 16));
        var sum = 0;
        for (var i = 1; i <= 100; i++) {
            sum += i;
        }
        for (var i = 1; i <= 99; i++) {
            if (i % 7 == 0 || i % 10 == 7 || parseInt(i / 10 )== 7 ) {
                document.write('<div></div>');
            }
        
         else {
            document.write('<div>' + i + '</div>')
        }

}
    </script>
</body>

</html>

<!DOCTYPE html>
<!-- 作者：董文博 | 学号：24002120307 | 建立时间：2026-11-18 | 使用大模型：GLM-5.3-Flash | 功能：移动端滑动切换美食卡片 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>滑动切换美食卡片</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    background: #1c1c28;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  /* 卡片容器：pan-y 保留纵向滚动，横向手势交给触摸逻辑 */
  .dwb_stage {
    width: 100%;
    max-width: 360px;
    touch-action: pan-y;
  }
  .dwb_card {
    height: 420px;
    border-radius: 20px;
    padding: 32px 24px;
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 12px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    user-select: none;
    transition: transform 0.3s ease, opacity 0.3s ease;
  }
  .dwb_card.dwb_anim_next { animation: dwbInNext 0.3s ease; }
  .dwb_card.dwb_anim_prev { animation: dwbInPrev 0.3s ease; }
  @keyframes dwbInNext {
    from { transform: translateX(60%); opacity: 0; }
    to   { transform: translateX(0);   opacity: 1; }
  }
  @keyframes dwbInPrev {
    from { transform: translateX(-60%); opacity: 0; }
    to   { transform: translateX(0);    opacity: 1; }
  }
  .dwb_emoji { font-size: 44px; }
  .dwb_name { font-size: 26px; font-weight: bold; }
  .dwb_desc { font-size: 15px; line-height: 1.7; opacity: 0.92; }
  .dwb_counter {
    margin-top: 18px;
    text-align: center;
    color: #cfd0dc;
    font-size: 15px;
    letter-spacing: 1px;
  }
  .dwb_tip {
    margin-top: 10px;
    text-align: center;
    color: #ffb347;
    font-size: 14px;
    min-height: 20px;
    opacity: 0;
    transition: opacity 0.25s;
  }
  .dwb_tip.dwb_show { opacity: 1; }
  .dwb_hint {
    margin-top: 14px;
    text-align: center;
    color: #8a8ba0;
    font-size: 13px;
  }
</style>
</head>
<body>
  <div class="dwb_stage" id="dwb_stage">
    <div class="dwb_card" id="dwb_card">
      <div class="dwb_emoji" id="dwb_emoji">🍗</div>
      <div class="dwb_name" id="dwb_name"></div>
      <div class="dwb_desc" id="dwb_desc"></div>
    </div>
  </div>
  <div class="dwb_counter" id="dwb_counter"></div>
  <div class="dwb_tip" id="dwb_tip"></div>
  <div class="dwb_hint">← 左滑下一张 · 右滑上一张 →</div>

  <script>
    // 数据：4 道菜的菜名、简介、渐变背景与图标
    var dwb_dishes = [
      { name: "宫保鸡丁", emoji: "🍗", desc: "川菜经典，酸甜微辣，鸡丁滑嫩、花生酥脆，是下馆子的必点招牌。", grad: "linear-gradient(135deg, #ff9966, #ff5e62)" },
      { name: "清蒸鲈鱼", emoji: "🐟", desc: "粤式清蒸做法，火候精准，鱼肉细嫩无腥，只以豉油与葱丝提鲜。", grad: "linear-gradient(135deg, #56ab2f, #a8e063)" },
      { name: "麻婆豆腐", emoji: "🌶️", desc: "麻辣鲜香烫，豆腐嫩而不碎，一勺红汤浇在米饭上就是一餐。", grad: "linear-gradient(135deg, #f5515f, #9f041b)" },
      { name: "佛跳墙", emoji: "🍲", desc: "闽菜之首，鲍参翅肚层层码放，慢火煨足一整夜，启坛香飘四邻。", grad: "linear-gradient(135deg, #4b6cb7, #182848)" }
    ];

    var dwb_index = 0;        // 当前卡片下标
    var dwb_startX = 0;       // touchstart 时的横坐标
    var dwb_cooldown = false; // 300ms 冷却开关，防止连滑一次跳两张
    var dwb_tipTimer = null;
    var dwb_card = document.getElementById("dwb_card");

    // 函数：把当前下标对应的菜品渲染到卡片上，并更新底部计数
    function dwb_render() {
      var dwb_dish = dwb_dishes[dwb_index];
      document.getElementById("dwb_emoji").textContent = dwb_dish.emoji;
      document.getElementById("dwb_name").textContent = dwb_dish.name;
      document.getElementById("dwb_desc").textContent = dwb_dish.desc;
      dwb_card.style.background = dwb_dish.grad;
      document.getElementById("dwb_counter").textContent =
        "第 " + (dwb_index + 1) + "/" + dwb_dishes.length + " 张";
    }

    // 函数：显示边界提示文字，1.2 秒后自动淡出
    function dwb_showTip(dwb_text) {
      var dwb_tip = document.getElementById("dwb_tip");
      dwb_tip.textContent = dwb_text;
      dwb_tip.classList.add("dwb_show");
      clearTimeout(dwb_tipTimer);
      dwb_tipTimer = setTimeout(function () {
        dwb_tip.classList.remove("dwb_show");
      }, 1200);
    }

    // 函数：切换卡片（dwb_dir 为 1 切下一张、-1 切上一张），含边界拦截、动画与 300ms 冷却
    function dwb_slide(dwb_dir) {
      if (dwb_cooldown) return;
      var dwb_next = dwb_index + dwb_dir;
      if (dwb_next < 0) { dwb_showTip("已经是第一张"); return; }
      if (dwb_next >= dwb_dishes.length) { dwb_showTip("已经是最后一张"); return; }
      dwb_index = dwb_next;
      dwb_cooldown = true;
      dwb_card.classList.remove("dwb_anim_next", "dwb_anim_prev");
      void dwb_card.offsetWidth;
      dwb_card.classList.add(dwb_dir === 1 ? "dwb_anim_next" : "dwb_anim_prev");
      dwb_render();
      setTimeout(function () { dwb_cooldown = false; }, 300);
    }

    var dwb_stage = document.getElementById("dwb_stage");

    // 记录手指按下时的横坐标
    dwb_stage.addEventListener("touchstart", function (dwb_e) {
      dwb_startX = dwb_e.changedTouches[0].clientX;
    }, { passive: true });

    // 手指抬起时计算横向位移，超过 40px 判定为滑动：左滑下一张、右滑上一张
    dwb_stage.addEventListener("touchend", function (dwb_e) {
      var dwb_dx = dwb_e.changedTouches[0].clientX - dwb_startX;
      if (Math.abs(dwb_dx) < 40) return;
      dwb_slide(dwb_dx < 0 ? 1 : -1);
    }, { passive: true });

    dwb_render();
  </script>
</body>
</html>
